<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Book icon -->
  <g transform="translate(25, 25) scale(0.5)">
    <!-- Book pages -->
    <rect x="15" y="20" width="70" height="60" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="20" y="25" width="60" height="50" rx="3" fill="#f8f9fa"/>
    
    <!-- Book spine -->
    <rect x="10" y="15" width="8" height="70" rx="4" fill="#ffffff"/>
    
    <!-- Text lines -->
    <line x1="30" y1="35" x2="70" y2="35" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="45" x2="65" y2="45" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="55" x2="60" y2="55" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="55" y2="65" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- AI sparkle -->
  <g transform="translate(65, 25)">
    <circle cx="0" cy="0" r="3" fill="#ffc107"/>
    <path d="M-6,0 L6,0 M0,-6 L0,6 M-4,-4 L4,4 M-4,4 L4,-4" stroke="#ffc107" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>